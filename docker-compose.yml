services:
  app:
    build: .
    image: smartcommerce_app
    container_name: smartcommerce_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - appnet
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: smartcommerce_web
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    networks:
      - appnet
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: smartcommerce_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: smartcommerce
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smartcommerce_phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M
    depends_on:
      - db
    networks:
      - appnet

volumes:
  dbdata:

networks:
  appnet:
    driver: bridge
